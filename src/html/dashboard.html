<div class="grid col-200">
  <!-- Total -->
  <section class="card" aria-label="Total of people being onboarded">
    <header class="card-header" data-href="onboarding">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <path d="M16 3.128a4 4 0 0 1 0 7.744" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <circle cx="9" cy="7" r="4" />
      </svg>
      <h2 class="card-title">Total</h2>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="ms-auto">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </header>
    <div class="card-body">
      <p class="card-number" id="total">0</p>
      <p class="text-muted mb-0">Currently onboarding</p>
    </div>
  </section>

  <!-- To do -->
  <section class="card" aria-label="Number of tasks to do">
    <header class="card-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M16 14v2.2l1.6 1" />
        <path d="M16 4h2a2 2 0 0 1 2 2v.832" />
        <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h2" />
        <circle cx="16" cy="16" r="6" />
        <rect x="8" y="2" width="8" height="4" rx="1" />
      </svg>
      <h2 class="card-title">To Do</h2>
    </header>
    <div class="card-body">
      <p id="todo" class="card-number">0</p>
      <p class="text-muted mb-0">Tasks to do</p>
    </div>
  </section>

  <!-- This Week -->
  <section class="card" aria-label="Number of people starting this week">
    <header class="card-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M8 2v4" />
        <path d="M16 2v4" />
        <rect width="18" height="18" x="3" y="4" rx="2" />
        <path d="M3 10h18" />
        <path d="m9 16 2 2 4-4" />
      </svg>
      <h2 class="card-title">This Week</h2>
    </header>
    <div class="card-body">
      <p class="card-number" id="this-week">0</p>
      <p class="text-muted mb-0">Starting this week</p>
    </div>
  </section>

  <!-- Ready -->
  <section class="card" aria-label="Number of people ready to start">
    <header class="card-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M8 2v4" />
        <path d="M16 2v4" />
        <rect width="18" height="18" x="3" y="4" rx="2" />
        <path d="M3 10h18" />
        <path d="m9 16 2 2 4-4" />
      </svg>
      <h2 class="card-title">Ready</h2>
    </header>
    <div class="card-body">
      <p class="card-number" id="starters-ready">0</p>
      <p class="text-muted mb-0">Ready to start</p>
    </div>
  </section>
</div>

<div class="grid col-375">
  <section class="card" aria-label="List of tasks to complete candidate's pre-employment checks">
    <header class="card-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M13 5h8" />
        <path d="M13 12h8" />
        <path d="M13 19h8" />
        <path d="m3 17 2 2 4-4" />
        <rect x="3" y="4" width="6" height="6" rx="1" />
      </svg>
      <h2 class="card-title">Onboarding Tasks</h2>
    </header>
    <div id="onboarding-list-container" class="card-body">
      <!-- JS -->
    </div>
  </section>

  <!-- Post Checks -->
  <section class="card" aria-label="List of tasks to complete candidate's post onboarding checks">
    <header class="card-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M13 5h8" />
        <path d="M13 12h8" />
        <path d="M13 19h8" />
        <path d="m3 17 2 2 4-4" />
        <rect x="3" y="4" width="6" height="6" rx="1" />
      </svg>
      <h2 class="card-title">Post Checks Tasks</h2>
    </header>
    <div id="post-check-list-container" class="card-body">
      <!-- JS -->
    </div>
  </section>

  <!-- Next Starters -->
  <section class="card" aria-label="List of people with a start date">
    <header class="card-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M16 14v2.2l1.6 1" />
        <path d="M16 2v4" />
        <path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5" />
        <path d="M3 10h5" />
        <path d="M8 2v4" />
        <circle cx="16" cy="16" r="6" />
      </svg>
      <h2 class="card-title">Next Starters</h2>
    </header>

    <div id="starters-container" class="card-body">
      <!-- JS -->
  </section>
</div>
