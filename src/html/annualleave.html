<section>
  <header class="section-header">
    <h3>Pro Rated Entitlement</h3>
  </header>

  <article class="section-body">
    <div>
      <h4>Calculator</h4>
      <form id="pro-rated">

        <div class="input-item">
          <label for="start-date">Start Date</label>
          <input type="date" id="start-date">
          <div class="input-helper">
            Enter your employment start date
          </div>
        </div>

        <div class="input-item">
          <label for="end-date">End Date</label>
          <input type="date" id="end-date">
          <div class="input-helper">
            Last day of holiday calendar
          </div>
        </div>

        <div class="input-item">
          <label for="annual-entitlement">Annual Entitlement</label>
          <input type="number" id="annual-entitlement" placeholder="202.5">
          <div class="input-helper">
            Enter your annual entitlement in hours
          </div>
        </div>

        <div class="form-btns mb-2">
          <button type="submit" class="btn green">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <rect width="16" height="20" x="4" y="2" rx="2" />
              <line x1="8" x2="16" y1="6" y2="6" />
              <line x1="16" x2="16" y1="14" y2="18" />
              <path d="M16 10h.01" />
              <path d="M12 10h.01" />
              <path d="M8 10h.01" />
              <path d="M12 14h.01" />
              <path d="M8 14h.01" />
              <path d="M12 18h.01" />
              <path d="M8 18h.01" />
            </svg>
            Calculate</button>
          <button type="reset" class="btn yellow">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            Reset</button>
        </div>
      </form>
    </div>

    <div>
      <h4>Results</h4>
      <div id="results">
        <p>Results will show here.</p>
      </div>
    </div>
  </article>
</section>
