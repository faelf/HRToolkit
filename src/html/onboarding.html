<section class="card card--full" aria-label="All candidates">
  <header class="card-header" aria-label="Page Header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
      <line x1="3" x2="21" y1="9" y2="9" />
      <line x1="3" x2="21" y1="15" y2="15" />
      <line x1="9" x2="9" y1="9" y2="21" />
      <line x1="15" x2="15" y1="9" y2="21" />
    </svg>
    <h4>Onboarding Tracker</h4>
  </header>

  <article class="card-body" aria-label="Candidates table">

    <div class="onboarding-tools" aria-label="Filters">

      <div class="search-input">
        <input id="search-candidate" type="search" class="search" placeholder="Search by name">
      </div>

      <div class="add-candidate-container">
        <button type="button" class="btn" popovertarget="add-candidate">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
            <path d="M14 2v5a1 1 0 0 0 1 1h5" />
            <path d="M9 15h6" />
            <path d="M12 18v-6" />
          </svg>
          Add Candidate</button>
        <dialog popover id="add-candidate">
          <div class="card-header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <line x1="19" x2="19" y1="8" y2="14" />
              <line x1="22" x2="16" y1="11" y2="11" />
            </svg>
            <h4>New Candidate</h4>
          </div>
          <form id="new-candidate">
            <div class="modal-body">
              <fieldset class="mb-2">
                <legend>Candidate Details</legend>
                <div class="input-item">
                  <label class="form-label" for="first-name">First Name</label>
                  <input type="text" id="first-name" name="firstName">
                  <div class="input-helper">
                    Enter first name as shown on the passport
                  </div>
                </div>
                <div class="input-item">
                  <label class="form-label" for="last-name">Last Name</label>
                  <input type="text" id="last-name" name="lastName">
                  <div class="input-helper">
                    Enter last name as shown on the passport
                  </div>
                </div>
              </fieldset>
              <fieldset class="mb-2">
                <legend>Employment Details</legend>
                <div class="input-item">
                  <label class="form-label" for="job-title">Job Title</label>
                  <input type="text" id="job-title" name="jobTitle">
                </div>
                <div class="input-item">
                  <label class="form-label" for="department">Department</label>
                  <input type="text" id="department" name="department">
                </div>
                <div class="input-item">
                  <label class="form-label" for="hiring-manager">Hiring Manager</label>
                  <input type="text" id="hiring-manager" name="hiringManager">
                </div>
              </fieldset>
            </div>

            <div class="modal-footer">
              <div class="form-buttons">
                <button class="btn green">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
                    <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                    <path d="M9 15h6" />
                    <path d="M12 18v-6" />
                  </svg>
                  Add Candidate</button>
                <button type="button" class="btn red" data-modal="close">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                  Close</button>
              </div>
            </div>
          </form>
        </dialog>
      </div>
    </div>

    <div id="candidates-container">
      <!-- Injected by JS -->
    </div>

  </article>
</section>
