<section>
  <header class="section-header">
    <h2 id="candidate-full-name" class="mb-2">Candidate</h2>
  </header>
  <article class="section-body">
    <form id="candidate-form">
      <!-- Candidate Details -->
      <fieldset class="candidate-details">
        <legend>Candidate Details</legend>
        <div class="input-item">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="firstName">
          <div class="input-helper">
            Enter first name as shown on the passport
          </div>
        </div>
        <div class="input-item">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="lastName">
          <div class="input-helper">
            Enter last name as shown on the passport
          </div>
        </div>
      </fieldset>

      <!-- Employment Details -->
      <fieldset class="employment-details">
        <legend>Employment Details</legend>
        <div class="input-item">
          <label for="job-title">Job Title</label>
          <input type="text" id="job-title" name="jobTitle">
        </div>
        <div class="input-item">
          <label for="department">Department</label>
          <input type="text" id="department" name="department">
        </div>
        <div class="input-item">
          <label for="hiring-manager">Hiring Manager</label>
          <input type="text" id="hiring-manager" name="hiringManager">
        </div>
      </fieldset>

      <!-- Onboarding Progress -->
      <fieldset class="onboarding-progress">
        <legend>Pre-employment checks</legend>
        <!-- Right to work -->
        <div class="input-item">
          <label for="right-to-work">Right to work</label>
          <select id="right-to-work" name="rightToWork">
            <option value="">Select</option>
            <option value="british">British</option>
            <option value="irish">Irish</option>
            <option value="swv">Skilled Worker Visa</option>
            <option value="visa">Visa</option>
            <option value="ilr">ILR</option>
          </select>
        </div>
        <!-- Expiry Date -->
        <div class="input-item">
          <label for="expiry-date">Expiry Date</label>
          <input type="date" id="expiry-date" name="expiryDate">
          <div class="input-helper">
            Date the visa expiries
          </div>
        </div>
        <!-- DBS -->
        <div class="input-item">
          <label for="dbs">DBS</label>
          <input type="date" id="dbs" name="dbs">
        </div>
        <!-- OH -->
        <div class="input-item">
          <label for="oh">OH</label>
          <input type="date" id="oh">
          <div class="input-helper">
            Date clearance was received
          </div>
        </div>
        <!-- References -->
        <div class="input-item">
          <label for="references">References</label>
          <input type="date" id="references" name="references">
        </div>
      </fieldset>

      <!-- Post Onboarding -->
      <fieldset class="accounts">
        <legend>Post Checks</legend>
        <!-- Start Date -->
        <div class="input-item">
          <label for="start-date">Start Date</label>
          <input type="date" id="start-date" name="startDate">
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="learn-space" name="learnSpace">
          <label for="learn-space">Learn Space</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="adp" name="adp">
          <label for="adp">ADP</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="name-badge" name="nameBadge">
          <label for="name-badge">Name Badge</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="completed" name="completed">
          <label for="completed">Onboarding Completed</label>
        </div>
      </fieldset>

      <div class="form-buttons">
        <button type="submit" class="btn green">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
            <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" />
            <path d="M7 3v4a1 1 0 0 0 1 1h7" />
          </svg>
          Save</button>
        <button type="reset" class="btn yellow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          Reset</button>
        <button type="button" class="btn red" id="delete-candidate">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
          Delete</button>
      </div>
    </form>
  </article>

</section>
