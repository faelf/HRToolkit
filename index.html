<!DOCTYPE html>
<html lang="en-GB">

<head>
  <script>
    (() => {
      const saved = localStorage.getItem("theme");
      const prefers = matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved ?? (prefers ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="src/images/favicon.svg" type="image/svg+xml">
  <!-- Light mode toolbar -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="hsl(0 0% 100%)">
  <!-- Dark mode toolbar -->
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="hsl(0 0% 30%)">
  <title>HR Helper</title>
  <meta name="author" content="Rafael Ferreira">
  <meta name="description" content="A single-page app built with vanilla JS">
  <link rel="stylesheet" href="src/style/style.min.css">
</head>

          <path d="M20 6 9 17l-5-5" />
        </svg>

      </label>

      <label class="theme-nav-btn">
        <input type="radio" name="theme-choice" value="dark">
        <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

      <label class="theme-nav-btn">
